<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Om Patel - Hero Train</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#0d1118}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif}
.tree{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-1.4deg)}to{transform:rotate(1.4deg)}}
@media (prefers-reduced-motion:reduce){.tree{animation:none}}
</style></head>
<body>
<section class="relative min-h-full overflow-hidden flex flex-col items-center justify-center text-center px-6 pb-44 bg-[linear-gradient(180deg,#090d19_0%,#121a33_45%,#2b3d78_100%)]">
  <h1 class="text-5xl sm:text-7xl md:text-8xl font-extrabold tracking-tighter leading-[1.02] text-white max-w-5xl">Turn complex data into intelligent solutions</h1>
  <a href="#" class="mt-10 rounded-full border border-white/80 px-9 py-4 text-white font-semibold hover:bg-white/10 transition">Let's talk</a>
  <p class="mt-12 max-w-2xl text-xs sm:text-sm tracking-[.25em] uppercase text-slate-400 font-semibold">We are turning raw data into intelligent predictive models.</p>

  <!-- ===== TRAIN ON CURVE: copy this block + the script below into your hero ===== -->
  <div class="train-wrap pointer-events-none absolute inset-x-0 bottom-0">
    <svg id="scene" viewBox="0 0 1440 300" preserveAspectRatio="xMidYMax slice" class="block w-full h-auto" aria-hidden="true">
      <defs>
        <linearGradient id="whiteG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#eef1f6"/><stop offset="1" stop-color="#c3cbd8"/></linearGradient>
        <linearGradient id="goldG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe58a"/><stop offset=".5" stop-color="#f0b932"/><stop offset="1" stop-color="#b97b12"/></linearGradient>
        <linearGradient id="glassC" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d6f1ff"/><stop offset="1" stop-color="#7fb9d6"/></linearGradient>
        <linearGradient id="creamG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e2e8f1"/></linearGradient>
        <linearGradient id="roofG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#aeb8c8"/><stop offset="1" stop-color="#7a8599"/></linearGradient>
        <linearGradient id="beamG"><stop offset="0" stop-color="#fff6c8" stop-opacity=".8"/><stop offset="1" stop-color="#fff6c8" stop-opacity="0"/></linearGradient>
        <radialGradient id="glowW"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
        <linearGradient id="edgeG" x1="0" x2="1"><stop offset="0" stop-color="#3b5bd6" stop-opacity="0"/><stop offset=".5" stop-color="#6f93ff"/><stop offset="1" stop-color="#3b5bd6" stop-opacity="0"/></linearGradient>
      </defs>
      <path d="M-200 190Q720 60 1640 190V300H-200Z" fill="#0d1118"/>
      <g id="trees"></g>
      <path d="M-200 193Q720 63 1640 193" fill="none" stroke="#151b28" stroke-width="7"/>
      <path d="M-200 196Q720 66 1640 196" fill="none" stroke="#7a5238" stroke-width="10" stroke-dasharray="5 15"/>
      <path id="track" d="M-200 190Q720 60 1640 190" fill="none" stroke="url(#edgeG)" stroke-width="2"/>
      <g id="train"></g>
      <g id="steam"></g>
    </svg>
  </div>
</section>

<script>
function wheelSVG(cx,cy,r,spokes){
  var s='<g transform="translate('+cx+' '+cy+')"><g class="rot" data-r="'+r+'"><circle r="'+r+'" fill="#1d2142"/><circle r="'+(r-2.6)+'" fill="url(#whiteG)"/><circle r="'+(r-4.6)+'" fill="none" stroke="#8d97a8" stroke-width=".8"/>';
  for(var i=0;i<spokes;i++) s+='<line y2="'+(-(r-3))+'" stroke="#8d97a8" stroke-width="'+(r>10?1.7:1.1)+'" transform="rotate('+(i*360/spokes)+')"/>';
  return s+'<circle r="'+(r*.28)+'" fill="url(#goldG)" stroke="#a96d10" stroke-width=".8"/><circle r="'+(r*.1)+'" fill="#e8631c"/></g></g>';
}
function locoSVG(){
  var s='<polygon points="96,-46 330,-70 330,-12" fill="url(#beamG)" opacity=".45"/>';
  s+='<rect x="-80" y="-27" width="198" height="9" rx="2" fill="#3a4150"/>';
  s+='<rect x="0" y="-55" width="86" height="29" rx="9" fill="url(#whiteG)"/>';
  s+='<rect x="16" y="-55" width="3" height="29" fill="#e8b130"/><rect x="42" y="-55" width="3" height="29" fill="#e8b130"/><rect x="64" y="-55" width="3" height="29" fill="#e8b130"/><rect x="6" y="-52" width="72" height="4" rx="2" fill="#fff" opacity=".4"/>';
  s+='<rect x="72" y="-55" width="20" height="29" rx="8" fill="#2f3550"/><rect x="72" y="-55" width="3" height="29" fill="#f2b630"/>';
  s+='<path d="M73 -55L76 -68L68 -77H94L86 -68L89 -55Z" fill="url(#whiteG)"/><rect x="66" y="-81" width="30" height="5" rx="2.5" fill="url(#goldG)"/>';
  s+='<path d="M26 -55Q26 -68 37 -68Q48 -68 48 -55Z" fill="url(#whiteG)" stroke="#c3cad6" stroke-width=".8"/><circle cx="37" cy="-71" r="3.2" fill="#f2b630"/>';
  s+='<path d="M50 -55Q50 -65 55 -65Q60 -65 60 -55Z" fill="url(#whiteG)" stroke="#a96d10" stroke-width=".7"/><circle cx="55" cy="-66.5" r="1.6" fill="#f2b630"/>';
  s+='<rect x="-8" y="-56" width="14" height="30" fill="url(#whiteG)"/>';
  s+='<rect x="-68" y="-70" width="64" height="44" rx="3" fill="url(#whiteG)"/><rect x="-75" y="-79" width="78" height="10" rx="3.5" fill="#c9d1de"/><rect x="-75" y="-79" width="78" height="3" rx="1.5" fill="#f2b630"/><rect x="-68" y="-31" width="64" height="3" fill="#f2b630"/>';
  s+='<path d="M-60 -36V-54Q-60 -63 -52 -63Q-44 -63 -44 -54V-36Z" fill="url(#glassC)" stroke="#f2b630" stroke-width="2"/><path d="M-36 -36V-54Q-36 -63 -28 -63Q-20 -63 -20 -54V-36Z" fill="url(#glassC)" stroke="#f2b630" stroke-width="2"/>';
  s+='<path d="M-56 -56l5 -4l-1 12z" fill="#fff" opacity=".4"/><path d="M-32 -56l5 -4l-1 12z" fill="#fff" opacity=".4"/>';
  s+='<rect x="-14" y="-27.5" width="1" height="0" /><rect x="50" y="-30" width="26" height="12" rx="4" fill="url(#whiteG)" stroke="#c3cad6" stroke-width=".8"/>';
  s+='<path d="M90 -28H100L124 -4V0H98Z" fill="url(#whiteG)" stroke="#8d97a8" stroke-width=".8"/><path d="M103 -22L112 -2M109 -24L118 -4" stroke="#8d97a8" stroke-width="1.2"/>';
  s+=wheelSVG(-30,-17,17,12)+wheelSVG(4,-17,17,12)+wheelSVG(38,-17,17,12)+wheelSVG(78,-9,9,8);
  s+='<line class="rod" stroke="#d6dae3" stroke-width="3.2" stroke-linecap="round"/><circle class="pin" r="2.4" fill="#f2b630"/><circle class="pin" r="2.4" fill="#f2b630"/><circle class="pin" r="2.4" fill="#f2b630"/>';
  s+='<circle cx="94" cy="-41" r="9" fill="url(#glowW)"/><circle cx="92.5" cy="-41" r="4.6" fill="#fff8d6" stroke="#f2b630" stroke-width="1.6"/>';
  return s;
}
function coachSVG(){
  var s='<rect x="-64" y="-9" width="8" height="3" fill="#3a2a22"/><rect x="56" y="-9" width="8" height="3" fill="#3a2a22"/>';
  s+='<rect x="-56" y="-13" width="112" height="7" rx="1.5" fill="#3a4150"/><rect x="-54" y="-52" width="108" height="40" rx="2" fill="url(#creamG)" stroke="#c3cad6" stroke-width=".8"/>';
  s+='<path d="M-59 -50Q-59 -60 -49 -62H49Q59 -60 59 -50Z" fill="url(#roofG)"/><rect x="-60" y="-51" width="120" height="3.2" rx="1.6" fill="#6f7b8e"/>';
  [-34,0,34].forEach(function(x){s+='<rect x="'+(x-5)+'" y="-66" width="10" height="5" rx="1.6" fill="#7c889b"/>'});
  for(var i=0;i<5;i++){var x=-46+i*19.4;
    s+='<path d="M'+x+' -26V-39Q'+x+' -46 '+(x+6.5)+' -46Q'+(x+13)+' -46 '+(x+13)+' -39V-26Z" fill="url(#glassC)" stroke="#d09a2a" stroke-width="1.4"/><rect x="'+(x-1.5)+'" y="-26" width="16" height="2.6" rx="1" fill="#d8a437"/><path d="M'+(x+1.5)+' -42l4 -3l-1 11z" fill="#fff" opacity=".4"/>';
    s+='<path d="M'+(x+.5)+' -15A6 6 0 0 1 '+(x+12.5)+' -15Z" fill="url(#goldG)" stroke="#3a6df0" stroke-width="1.2"/>';}
  s+='<rect x="-36" y="-10" width="24" height="5" rx="2" fill="#2a2230"/><rect x="12" y="-10" width="24" height="5" rx="2" fill="#2a2230"/>';
  s+=wheelSVG(-30,-7,7,6)+wheelSVG(-18,-7,7,6)+wheelSVG(18,-7,7,6)+wheelSVG(30,-7,7,6);
  return s;
}


function treesSVG(P,total){
  var seed=11;function R(){seed=(seed*16807)%2147483647;return seed/2147483647}
  function pick(a){return a[Math.floor(R()*a.length)]}
  function tree(far){
    var pine=R()<.6,h=(far?34:46)+R()*(far?34:60),w=h*(pine?.5:.66),s='',
        c=far?pick(['#2a4a66','#2c5470','#27425e']):(pine?pick(['#183d3a','#1f4b44','#14322f']):pick(['#23554a','#2a6252','#1c463f']));
    s+='<rect x="'+(-w*.06)+'" y="'+(-h*.2)+'" width="'+(w*.12)+'" height="'+(h*.2)+'" fill="'+(far?'#233a52':'#2a1d18')+'"/>';
    if(pine){
      [[-.55,-.1,.52],[-.78,-.3,.42],[-1,-.55,.32]].forEach(function(t){
        var a=t[0]*h,b=t[1]*h,hw=t[2]*w;
        s+='<polygon points="0,'+a+' '+(-hw)+','+b+' '+hw+','+b+'" fill="'+c+'"/><polygon points="0,'+a+' 0,'+b+' '+hw+','+b+'" fill="#fff" opacity=".07"/>';
      });
    }else{
      s+='<circle cx="0" cy="'+(-h*.62)+'" r="'+(w*.5)+'" fill="'+c+'"/><circle cx="'+(-w*.3)+'" cy="'+(-h*.46)+'" r="'+(w*.36)+'" fill="'+c+'"/><circle cx="'+(w*.3)+'" cy="'+(-h*.48)+'" r="'+(w*.36)+'" fill="'+c+'"/><circle cx="'+(w*.14)+'" cy="'+(-h*.7)+'" r="'+(w*.3)+'" fill="#fff" opacity=".07"/>';
    }
    return s;
  }
  var out='';
  [[true,26,40,-6],[false,40,56,3]].forEach(function(L){
    for(var d=30;d<total-30;d+=L[1]+R()*L[2]){
      var p=P(d);
      out+='<g transform="translate('+p.x.toFixed(1)+' '+(p.y+L[3]).toFixed(1)+')"><g class="tree" style="animation-delay:-'+(R()*5).toFixed(2)+'s">'+tree(L[0])+'</g></g>';
    }
  });
  return out;
}


(function(){
  var NS="http://www.w3.org/2000/svg",track=document.getElementById('track'),train=document.getElementById('train'),steam=document.getElementById('steam');
  document.getElementById("trees").innerHTML=treesSVG(function(s){return track.getPointAtLength(s)},track.getTotalLength());
  var total=track.getTotalLength(),S=.9,SPEED=170,last=0,pos=-250,cars=[],puffs=[],acc=0;
  // [type, rear-contact offset behind the loco, contact span]
  [['loco',0,106],['coach',140,60],['coach',262,60],['coach',384,60]].forEach(function(d){
    var g=document.createElementNS(NS,'g');g.innerHTML=d[0]==='loco'?locoSVG():coachSVG();train.appendChild(g);
    cars.push({g:g,off:d[1]*S,span:d[2]*S,loco:d[0]==='loco',rots:[].slice.call(g.querySelectorAll('.rot')),rod:g.querySelector('.rod'),pins:[].slice.call(g.querySelectorAll('.pin'))});
  });
  function P(s){return track.getPointAtLength(Math.min(Math.max(s,0),total))}
  function place(c,s,t,spawn){
    var cs=s-c.off,a=P(cs),b=P(cs+c.span),ang=Math.atan2(b.y-a.y,b.x-a.x),deg=ang*57.2958,w=pos/S;
    c.g.setAttribute('transform','translate('+a.x+' '+(a.y+Math.sin(t/60+c.off)*.3)+') rotate('+deg+') scale('+S+') translate(30 0)');
    c.g.style.display=(cs<-300||cs>total+300)?'none':'';
    c.rots.forEach(function(r){r.setAttribute('transform','rotate('+(w/r.getAttribute('data-r')*57.2958)+')')});
    if(c.loco){
      var q=w/17,cx=Math.cos(q)*8,cy=Math.sin(q)*8,xs=[-30,4,38];
      c.rod.setAttribute('x1',xs[0]+cx);c.rod.setAttribute('y1',-17+cy);c.rod.setAttribute('x2',xs[2]+cx);c.rod.setAttribute('y2',-17+cy);
      c.pins.forEach(function(p,i){p.setAttribute('cx',xs[i]+cx);p.setAttribute('cy',-17+cy)});
      if(spawn){var u=S*110,v=S*-82;puff(a.x+u*Math.cos(ang)-v*Math.sin(ang),a.y+u*Math.sin(ang)+v*Math.cos(ang))}
    }
  }
  function puff(x,y){
    var g=document.createElementNS(NS,'g'),k=[[0,0,1],[-7,3,.8],[6,2,.75]].map(function(o){var e=document.createElementNS(NS,'circle');e.setAttribute('fill','#f4f6fa');g.appendChild(e);return {e:e,o:o}});
    steam.appendChild(g);puffs.push({g:g,k:k,x:x,y:y,age:0,vx:-12-Math.random()*10,vy:-26-Math.random()*10});
  }
  function frame(t){
    var dt=Math.min((t-last)/1000,.05);last=t;pos+=SPEED*dt;acc+=dt;
    if(pos>total+800) pos=-1200;
    var spawn=acc>.16&&pos>-100&&pos<total+100;if(spawn)acc=0;
    cars.forEach(function(c){place(c,pos,t,spawn)});
    for(var i=puffs.length-1;i>=0;i--){var p=puffs[i];p.age+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;var l=p.age/2.4;
      if(l>=1){steam.removeChild(p.g);puffs.splice(i,1);continue}
      p.k.forEach(function(k){k.e.setAttribute('cx',p.x+k.o[0]*(1+l));k.e.setAttribute('cy',p.y+k.o[1]);k.e.setAttribute('r',(6+l*16)*k.o[2])});
      p.g.setAttribute('opacity',(.9*(1-l*l)).toFixed(2));}
    requestAnimationFrame(frame);
  }
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){pos=total*.62;cars.forEach(function(c){place(c,pos,0,false)})}
  else requestAnimationFrame(frame);
})();
</script>
</body></html>
